name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Find TEST MITRA ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract TEST MITRA ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.find_zip.outputs.zip }}" -d extracted

      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Android project
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          echo "Android project files:"
          find . -maxdepth 3 -type f | sort

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

      - name: Configure Android SDK 36
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/compileSdk = 36/g' \
            -e 's/compileSdk[[:space:]]\+[0-9][0-9]*/compileSdk 36/g' \
            -e 's/targetSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/targetSdk = 36/g' \
            -e 's/targetSdk[[:space:]]\+[0-9][0-9]*/targetSdk 36/g' \
            {} \;

      - name: Remove broken Google Services Kotlin patch
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          APP_GRADLE="app/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then

            sed -i '/import com\.google\.gms\.google-services\.GoogleServicesPlugin\.MissingGoogleServicesStrategy/d' "$APP_GRADLE"

            sed -i '/MissingGoogleServicesStrategy/d' "$APP_GRADLE"

            sed -i '/GoogleServicesPlugin/d' "$APP_GRADLE"

            sed -i '/googleServices\.missingStrategy/d' "$APP_GRADLE"

            sed -i '/missingGoogleServicesStrategy/d' "$APP_GRADLE"

          fi

          echo "Checking app/build.gradle.kts:"
          sed -n '1,120p' "$APP_GRADLE"

      - name: Disable Google Services plugin if present
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          APP_GRADLE="app/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then

            sed -i '/id("com.google.gms.google-services")/d' "$APP_GRADLE"
            sed -i "/id('com.google.gms.google-services')/d" "$APP_GRADLE"
            sed -i '/apply(plugin = "com.google.gms.google-services")/d' "$APP_GRADLE"

          fi

      - name: Fix deprecated Android options
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i \
            '/android.enableJetifier/d' {} \;

          find . -type f \( -name "gradle.properties" \) -exec sed -i \
            '/android.enableJetifier/d' {} \;

      - name: Verify Gradle wrapper
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew --version

      - name: Clean project
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          ./gradlew clean --no-daemon --stacktrace

      - name: Build TEST MITRA Debug APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          echo "Starting TEST MITRA APK build..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache

      - name: Find APK
        id: find_apk
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ steps.android_project.outputs.project_dir }}/${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error

      - name: Build successful
        run: |
          echo "======================================"
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"

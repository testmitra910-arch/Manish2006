name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."


      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"


      - name: Locate MainActivity
        shell: bash
        run: |
          set -e

          echo "Searching MainActivity.kt..."

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found!"
            echo "Available Kotlin files:"
            find "$PROJECT_DIR/app/src/main" \
              -type f \
              -name "*.kt" \
              -print
            exit 1
          fi

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

          echo "MainActivity found:"
          echo "$MAIN_FILE"


      - name: Fix MainActivity
        shell: bash
        run: |
          set -e

          echo "Checking MainActivity..."

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])

          text = file.read_text(encoding="utf-8")

          replacements = {
              "adminProfile.isMainAdmin": "profile.isMainAdmin",
              "adminProfile?.isMainAdmin": "profile?.isMainAdmin"
          }

          changed = False

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True

          if changed:
              file.write_text(text, encoding="utf-8")
              print("MainActivity fixed successfully.")
          else:
              print("No adminProfile reference requiring replacement was found.")
          PY


      - name: Fix Gradle Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          PROPS="$PROJECT_DIR/gradle.properties"

          touch "$PROPS"

          if grep -q "^android.disallowKotlinSourceSets=" "$PROPS"; then
            sed -i \
              's/^android.disallowKotlinSourceSets=.*/android.disallowKotlinSourceSets=false/' \
              "$PROPS"
          else
            echo "" >> "$PROPS"
            echo "# TEST MITRA compatibility" >> "$PROPS"
            echo "android.disallowKotlinSourceSets=false" >> "$PROPS"
          fi

          echo "gradle.properties:"
          cat "$PROPS"


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      - name: Create .env from GitHub Secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing!"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing!"
            exit 1
          fi

          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > "$PROJECT_DIR/.env"
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> "$PROJECT_DIR/.env"

          echo ".env created successfully."


      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "TEST MITRA PROJECT"
          echo "================================"

          echo "MainActivity:"
          echo "$MAIN_FILE"

          echo "Gradle version:"
          gradle --version

          echo "================================"


      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "BUILDING TEST MITRA APK"
          echo "================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

          echo "================================"
          echo "BUILD SUCCESSFUL"
          echo "================================"


      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find ZIP
      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 4. Extract project
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      # 5. Locate Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "ANDROID PROJECT: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Create google-services.json if missing
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          APP_DIR="$PROJECT_DIR/app"

          mkdir -p "$APP_DIR"

          if [ ! -f "$APP_DIR/google-services.json" ]; then
            echo "google-services.json not found."

            cat > "$APP_DIR/google-services.json" <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "test-mitra",
              "storage_bucket": "test-mitra.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.testmitra"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "DUMMY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

            echo "Dummy google-services.json created."
          else
            echo "google-services.json already exists."
          fi

      # 7. Remove duplicate google-services files
      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR" \
            -type f \
            -name "google-services.json" \
            -print

      # 8. Configure AndroidX / Kotlin
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          grep -q "^android.useAndroidX=" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          grep -q "^android.disallowKotlinSourceSets=" gradle.properties || \
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties

          grep -q "^kotlin.code.style=" gradle.properties || \
            echo "kotlin.code.style=official" >> gradle.properties

          echo "---- gradle.properties ----"
          cat gradle.properties

      # 9. Fix Kotlin source compatibility
      - name: Fix Kotlin source compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          echo "Kotlin sourceSets compatibility handled through:"
          echo "android.disallowKotlinSourceSets=false"

      # 10. Fix compileSdk / targetSdk
      - name: Fix minSdk and targetSdk compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APP_GRADLE="app/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then

            if grep -q "compileSdk" "$APP_GRADLE"; then
              sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 35/g' "$APP_GRADLE"
            fi

            if grep -q "targetSdk" "$APP_GRADLE"; then
              sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 35/g' "$APP_GRADLE"
            fi

            if grep -q "minSdk" "$APP_GRADLE"; then
              sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 23/g' "$APP_GRADLE"
            fi

          fi

      # 11. Fix compileSdk property if old DSL exists
      - name: Fix compileSdk Gradle DSL
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "app/build.gradle.kts" ]; then

            sed -i -E \
              's/compileSdk[[:space:]]+[0-9]+/compileSdk = 35/g' \
              app/build.gradle.kts || true

            sed -i -E \
              's/targetSdk[[:space:]]+[0-9]+/targetSdk = 35/g' \
              app/build.gradle.kts || true

          fi

      # 12. Verify MainActivity
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          echo "Searching MainActivity..."

          find "$PROJECT_DIR/app/src" \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            -print

      # 13. Prepare Gradle
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper not found."

            gradle wrapper --gradle-version 8.11.1

          else
            chmod +x gradlew
          fi

          ./gradlew --version

      # 14. Clean project
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean --no-daemon --stacktrace

      # 15. Build APK
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # 16. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 17. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 18. Success
      - name: Build successful
        shell: bash
        run: |
          echo "======================================"
          echo "       TEST MITRA APK BUILD SUCCESS"
          echo "======================================"
          echo "APK has been uploaded in Artifacts."

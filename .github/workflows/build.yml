name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find TEST MITRA ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -type f -iname '*test*mitra*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "TEST MITRA ZIP not found"
            exit 1
          fi
          echo "ZIP=$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract TEST MITRA project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -printf '%h\n' | sed 's#/app$##' | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Create google-services.json
        shell: bash
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > "${{ steps.project.outputs.project }}/app/google-services.json"
          fi

      - name: Configure AndroidX
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project }}"
          touch "$PROJECT/gradle.properties"

          grep -q '^android.useAndroidX=' "$PROJECT/gradle.properties" \
            && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROJECT/gradle.properties" \
            || echo 'android.useAndroidX=true' >> "$PROJECT/gradle.properties"

          grep -q '^android.enableJetifier=' "$PROJECT/gradle.properties" \
            && sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROJECT/gradle.properties" \
            || echo 'android.enableJetifier=true' >> "$PROJECT/gradle.properties"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project }}"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project }}/app/build/outputs/apk" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK=$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Build successful
        run: echo "TEST MITRA APK BUILD SUCCESS"

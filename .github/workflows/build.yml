name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. JAVA 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. FIND AND EXTRACT TEST MITRA ZIP
      # --------------------------------------------------
      - name: Find and extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      # --------------------------------------------------
      # 4. FIX ANDROID BUILD CONFIGURATION
      # --------------------------------------------------
      - name: Fix Android build configuration
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          echo "Fixing Android build configuration..."

          # AGP 9.x -> stable AGP compatible with this project
          if [ -f "$P/gradle/libs.versions.toml" ]; then
            sed -i 's/agp = "9\.1\.1"/agp = "8.9.2"/' \
              "$P/gradle/libs.versions.toml"
          fi

          # ------------------------------------------------
          # Compile SDK
          # ------------------------------------------------
          if [ -f "$P/app/build.gradle.kts" ]; then

            sed -i \
              's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/' \
              "$P/app/build.gradle.kts"

            sed -i \
              's/targetSdk = 36/targetSdk = 35/' \
              "$P/app/build.gradle.kts"

          fi

          # ------------------------------------------------
          # AndroidX / Jetifier
          # ------------------------------------------------
          touch "$P/gradle.properties"

          grep -q '^android.useAndroidX=true' \
            "$P/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$P/gradle.properties"

          grep -q '^android.enableJetifier=true' \
            "$P/gradle.properties" || \
            echo 'android.enableJetifier=true' >> "$P/gradle.properties"

          # ------------------------------------------------
          # Disable configuration cache
          # ------------------------------------------------
          sed -i \
            's/^org.gradle.configuration-cache=true$/org.gradle.configuration-cache=false/' \
            "$P/gradle.properties"

          grep -q '^org.gradle.configuration-cache=' \
            "$P/gradle.properties" || \
            echo 'org.gradle.configuration-cache=false' >> "$P/gradle.properties"

          echo "Build configuration fixed."

      # --------------------------------------------------
      # 5. FIX KOTLIN SOURCE SETS
      # --------------------------------------------------
      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          echo "Checking Kotlin source sets..."

          # Allow the old Kotlin sourceSets configuration
          # used by this project.
          if ! grep -q '^android.disallowKotlinSourceSets=' "$P/gradle.properties"; then
            echo 'android.disallowKotlinSourceSets=false' >> "$P/gradle.properties"
          fi

          # If android.sourceSets is available, keep it.
          # Do not modify the project's source structure.

          echo "Kotlin source set compatibility configured."

      # --------------------------------------------------
      # 6. FIX KNOWN MAINACTIVITY REFERENCE
      # --------------------------------------------------
      - name: Fix MainActivity reference
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"
          MAIN_FILE=$(find "$P" \
            -type f \
            -name 'MainActivity.kt' \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "MainActivity.kt not found."
            exit 1
          fi

          echo "MainActivity: $MAIN_FILE"

          # Fix only the known compilation error:
          # Unresolved reference: adminProfile
          #
          # The callback is already inside the Authenticated
          # block where the variable is named 'profile'.

          sed -i \
            's/onOpenSettings = { if (adminProfile\.isMainAdmin)/onOpenSettings = { if (profile.isMainAdmin)/g' \
            "$MAIN_FILE"

          sed -i \
            's/onOpenSettings = {if (adminProfile\.isMainAdmin)/onOpenSettings = {if (profile.isMainAdmin)/g' \
            "$MAIN_FILE"

          echo "Checking remaining adminProfile reference..."

          grep -n "onOpenSettings" "$MAIN_FILE" || true

          echo "MainActivity reference fix completed."

      # --------------------------------------------------
      # 7. CONFIGURE SUPABASE
      # --------------------------------------------------
      - name: Configure Supabase for build
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then

            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
              "$SUPABASE_URL" \
              "$SUPABASE_ANON_KEY" > "$P/.env"

            echo "Supabase secrets configured."

          else

            if [ -f "$P/.env.example" ]; then
              cp "$P/.env.example" "$P/.env"
              echo "Supabase secrets not supplied; using .env.example."
            else
              echo "WARNING: .env.example not found."
              touch "$P/.env"
            fi

          fi

      # --------------------------------------------------
      # 8. SETUP GRADLE 8.11.1
      # --------------------------------------------------
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # --------------------------------------------------
      # 9. VERIFY PROJECT
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          echo "Project directory:"
          echo "$P"

          echo ""
          echo "Gradle files:"
          find "$P" -maxdepth 2 \
            -type f \
            \( -name '*.gradle' -o -name '*.gradle.kts' \) \
            -print | sort

          echo ""
          echo "MainActivity:"
          find "$P" \
            -type f \
            -name 'MainActivity.kt' \
            -print

      # --------------------------------------------------
      # 10. CLEAN PROJECT
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          echo "Project cleaned."

      # --------------------------------------------------
      # 11. BUILD DEBUG APK
      # --------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting TEST MITRA APK build..."

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean \
            assembleDebug

      # --------------------------------------------------
      # 12. FIND APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."

            echo ""
            echo "Available files:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" \
            apk-output/TEST-MITRA-debug.apk

          echo "APK copied successfully."

      # --------------------------------------------------
      # 13. UPLOAD APK
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 14. BUILD SUCCESS
      # --------------------------------------------------
      - name: Build successful
        shell: bash
        run: |
          echo "========================================"
          echo "       TEST MITRA APK BUILD SUCCESS"
          echo "========================================"
          echo "APK: apk-output/TEST-MITRA-debug.apk"

name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" -type f -name "settings.gradle.kts" -o -name "settings.gradle" \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > "$PROJECT_DIR/app/google-services.json"
            echo "google-services.json created"
          else
            echo "GOOGLE_SERVICES_JSON secret not provided."
          fi

      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR" -type f -name "google-services.json" -print

          FILES=$(find "$PROJECT_DIR" -type f -name "google-services.json")

          FIRST=""
          for f in $FILES; do
            if [ -z "$FIRST" ]; then
              FIRST="$f"
            else
              if [ "$f" != "$PROJECT_DIR/app/google-services.json" ]; then
                rm -f "$f"
              fi
            fi
          done

      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          GRADLE_PROPS="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPS"

          if ! grep -q "^android.useAndroidX=" "$GRADLE_PROPS"; then
            echo "android.useAndroidX=true" >> "$GRADLE_PROPS"
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$GRADLE_PROPS"
          fi

          if ! grep -q "^android.enableJetifier=" "$GRADLE_PROPS"; then
            echo "android.enableJetifier=true" >> "$GRADLE_PROPS"
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$GRADLE_PROPS"
          fi

          echo "Gradle properties:"
          cat "$GRADLE_PROPS"

      - name: Fix compileSdk Gradle DSL
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          echo "Before fix:"
          sed -n '1,50p' "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Fix invalid modern compileSdk DSL:
          # compileSdk {
          #     version = release(36) {
          #         minApiLevel = 1
          #     }
          # }
          text = re.sub(
              r'compileSdk\s*\{\s*version\s*=\s*release\s*\(\s*36\s*\)\s*\{\s*minApiLevel\s*=\s*1\s*\}\s*\}',
              'compileSdk = 36',
              text,
              flags=re.S
          )

          # Also handle other release(...) variants.
          text = re.sub(
              r'compileSdk\s*\{\s*version\s*=\s*release\s*\(\s*\d+\s*\)\s*\{.*?\}\s*\}',
              'compileSdk = 36',
              text,
              flags=re.S
          )

          # If compileSdk is still not present, add it inside android block.
          if not re.search(r'(?m)^\s*compileSdk\s*=', text):
              text = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    compileSdk = 36',
                  text,
                  count=1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo "After fix:"
          sed -n '1,50p' "$APP_GRADLE"

      - name: Fix minSdk and targetSdk compatibility
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'minSdk\s*=\s*.*',
              'minSdk = 23',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*.*',
              'targetSdk = 35',
              text
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f -name "MainActivity.kt" \
            | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN_ACTIVITY"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Gradle wrapper not found."
            exit 1
          fi

          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building TEST MITRA APK..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR" -type f | grep -E '\.apk$' || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

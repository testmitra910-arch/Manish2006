name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find existing ZIP
      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for TEST MITRA ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 4. Extract existing ZIP
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed."

          find extracted -maxdepth 5 -type f | sort | head -300

      # 5. Locate Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          while IFS= read -r settings; do
            DIR=$(dirname "$settings")

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Create google-services.json if secret exists
      - name: Create google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "google-services.json already exists."

          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" \
              > "$PROJECT_DIR/app/google-services.json"

            echo "google-services.json created."

          else
            echo "No google-services.json secret."
            echo "Continuing..."
          fi

      # 7. Remove duplicate google-services.json
      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          FILES=$(find "$PROJECT_DIR" \
            -type f \
            -name "google-services.json")

          COUNT=$(echo "$FILES" | grep -c "google-services.json" || true)

          echo "Found $COUNT google-services.json file(s)."

          if [ "$COUNT" -gt 1 ]; then
            FIRST=""

            while IFS= read -r FILE; do

              if [ -z "$FIRST" ]; then
                FIRST="$FILE"
              else
                echo "Removing duplicate:"
                echo "$FILE"
                rm -f "$FILE"
              fi

            done <<< "$FILES"
          fi

      # 8. AndroidX
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          if grep -q "^android.useAndroidX=" "$GRADLE_PROPERTIES"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$GRADLE_PROPERTIES"
          else
            echo "android.useAndroidX=true" \
              >> "$GRADLE_PROPERTIES"
          fi

          if grep -q "^android.enableJetifier=" "$GRADLE_PROPERTIES"; then
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$GRADLE_PROPERTIES"
          else
            echo "android.enableJetifier=true" \
              >> "$GRADLE_PROPERTIES"
          fi

          echo "AndroidX configured."

      # 9. Kotlin compatibility
      - name: Fix Kotlin source compatibility
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            sed -i \
              's/jvmTarget[[:space:]]*=[[:space:]]*["'\''][^"'\'']*["'\'']/jvmTarget = "17"/g' \
              "$FILE" || true

          done

          echo "Kotlin compatibility fixed."

      # 10. SDK compatibility
      - name: Fix minSdk and targetSdk compatibility
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            sed -i \
              's/minSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/minSdk = 23/g' \
              "$FILE" || true

            sed -i \
              's/targetSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/targetSdk = 35/g' \
              "$FILE" || true

            sed -i \
              's/minSdkVersion[[:space:]]*[0-9][0-9]*/minSdkVersion 23/g' \
              "$FILE" || true

            sed -i \
              's/targetSdkVersion[[:space:]]*[0-9][0-9]*/targetSdkVersion 35/g' \
              "$FILE" || true

          done

      # 11. compileSdk compatibility
      - name: Fix compileSdk Gradle DSL
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            sed -i \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/compileSdk = 35/g' \
              "$FILE" || true

            sed -i \
              's/compileSdkVersion[[:space:]]*[0-9][0-9]*/compileSdkVersion 35/g' \
              "$FILE" || true

          done

      # 12. Fix old Kotlin DSL issue
      - name: Fix compileSdk Gradle DSL issue
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$FILE" ]; then

            sed -i \
              's/release[[:space:]]*(minorApiLevel[[:space:]]*=[^)]*)/release { version = JavaVersion.VERSION_17 }/g' \
              "$FILE" || true

            sed -i \
              '/minorApiLevel[[:space:]]*=/d' \
              "$FILE" || true

          fi

      # 13. Verify MainActivity
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          echo "Searching MainActivity..."

          MAIN=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity not found."
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN"

      # 14. IMPORTANT: Gradle 9.3.1
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 15. Prepare Gradle
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Gradle version:"
          gradle --version

          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "No Gradle wrapper."
            echo "Using Gradle 9.3.1."
          fi

      # 16. Clean project
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # 17. Build Debug APK
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "Building TEST MITRA Debug APK"
          echo "================================"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace

          fi

      # 18. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."

            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TEST-MITRA-debug.apk"

      # 19. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error

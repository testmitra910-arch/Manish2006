name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. SETUP JDK 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. FIND TEST MITRA ZIP
      # --------------------------------------------------
      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          echo "Searching TEST MITRA ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. EXTRACT PROJECT
      # --------------------------------------------------
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extract completed."

          find extracted -maxdepth 5 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            | head -50

      # --------------------------------------------------
      # 5. LOCATE ANDROID PROJECT
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            DIR=$(dirname "$settings_file")

            if [ -d "$DIR/app" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 6 -type d | head -100
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # --------------------------------------------------
      # 6. CREATE GOOGLE SERVICES FILE IF MISSING
      # --------------------------------------------------
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          APP_DIR="$ANDROID_PROJECT/app"

          mkdir -p "$APP_DIR"

          if [ -n "${SUPABASE_URL:-}" ]; then
            echo "Supabase secret detected."
          fi

          if [ ! -f "$APP_DIR/google-services.json" ]; then
            cat > "$APP_DIR/google-services.json" <<'EOF'
{
  "project_info": {
    "project_number": "000000000000",
    "project_id": "test-mitra",
    "storage_bucket": "test-mitra.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
        "android_client_info": {
          "package_name": "com.example.testmitra"
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      # --------------------------------------------------
      # 7. REMOVE DUPLICATE GOOGLE SERVICES
      # --------------------------------------------------
      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          find "$ANDROID_PROJECT" \
            -type f \
            -name "google-services.json" \
            -print

          FIRST_FILE=$(find "$ANDROID_PROJECT" \
            -type f \
            -name "google-services.json" \
            | head -n 1)

          if [ -n "$FIRST_FILE" ]; then
            cp "$FIRST_FILE" "$ANDROID_PROJECT/app/google-services.json"
          fi

          find "$ANDROID_PROJECT" \
            -type f \
            -name "google-services.json" \
            ! -path "$ANDROID_PROJECT/app/google-services.json" \
            -delete || true

      # --------------------------------------------------
      # 8. CONFIGURE ANDROID SDK
      # --------------------------------------------------
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROPS="$ANDROID_PROJECT/gradle.properties"

          touch "$PROPS"

          grep -q "^android.useAndroidX=" "$PROPS" \
            || echo "android.useAndroidX=true" >> "$PROPS"

          grep -q "^android.enableJetifier=" "$PROPS" \
            || echo "android.enableJetifier=false" >> "$PROPS"

          grep -q "^android.nonTransitiveRClass=" "$PROPS" \
            || echo "android.nonTransitiveRClass=false" >> "$PROPS"

          grep -q "^android.nonFinalResIds=" "$PROPS" \
            || echo "android.nonFinalResIds=false" >> "$PROPS"

      # --------------------------------------------------
      # 9. FIX APP BUILD.GRADLE.KTS
      # --------------------------------------------------
      - name: Fix Android compileSdk and targetSdk
        shell: bash
        run: |
          set -e

          APP="$ANDROID_PROJECT/app/build.gradle.kts"

          if [ ! -f "$APP" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "Original app/build.gradle.kts:"
          cat "$APP"

          python3 <<'PY'
          import re
          from pathlib import Path

          p = Path(r"${ANDROID_PROJECT}/app/build.gradle.kts")
          text = p.read_text()

          # Fix compileSdk
          if re.search(r'\bcompileSdk\s*=\s*\d+', text):
              text = re.sub(
                  r'\bcompileSdk\s*=\s*\d+',
                  'compileSdk = 35',
                  text
              )
          elif re.search(r'\bcompileSdk\s+\d+', text):
              text = re.sub(
                  r'\bcompileSdk\s+\d+',
                  'compileSdk = 35',
                  text
              )
          else:
              text = text.replace(
                  'android {',
                  'android {\n    compileSdk = 35',
                  1
              )

          # Fix targetSdk
          if re.search(r'\btargetSdk\s*=\s*\d+', text):
              text = re.sub(
                  r'\btargetSdk\s*=\s*\d+',
                  'targetSdk = 35',
                  text
              )
          elif re.search(r'\btargetSdk\s+\d+', text):
              text = re.sub(
                  r'\btargetSdk\s+\d+',
                  'targetSdk = 35',
                  text
              )
          else:
              # Add targetSdk inside defaultConfig
              if 'defaultConfig {' in text:
                  text = text.replace(
                      'defaultConfig {',
                      'defaultConfig {\n        targetSdk = 35',
                      1
                  )

          # Fix minSdk if missing
          if 'defaultConfig {' in text and not re.search(
              r'\bminSdk\s*=\s*\d+',
              text
          ):
              text = text.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        minSdk = 23',
                  1
              )

          # Remove old kotlinOptions block that can conflict
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S
          )

          p.write_text(text)
          PY

          echo "Fixed app/build.gradle.kts:"
          cat "$APP"

      # --------------------------------------------------
      # 10. FIX GRADLE WRAPPER
      # --------------------------------------------------
      - name: Set Gradle 9.3.1
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

      # --------------------------------------------------
      # 11. GENERATE GRADLE WRAPPER
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          rm -f gradlew
          rm -f gradlew.bat

          curl -L \
            -o /tmp/gradle-9.3.1-bin.zip \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip

          rm -rf /tmp/gradle931

          mkdir -p /tmp/gradle931

          unzip -q \
            /tmp/gradle-9.3.1-bin.zip \
            -d /tmp/gradle931

          /tmp/gradle931/gradle-9.3.1/bin/gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      # --------------------------------------------------
      # 12. VERIFY PROJECT
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Project:"
          pwd

          echo "Files:"
          find . -maxdepth 2 -type f \
            | sort \
            | head -100

          echo "Settings:"
          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          elif [ -f settings.gradle ]; then
            cat settings.gradle
          fi

          echo "App Gradle:"
          cat app/build.gradle.kts

      # --------------------------------------------------
      # 13. CLEAN
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 14. BUILD DEBUG APK
      # --------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Building TEST MITRA APK..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # --------------------------------------------------
      # 15. FIND APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_PROJECT" \
            -type f \
            -name "*.apk" \
            | grep -E "debug.*\.apk$" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."

            find "$ANDROID_PROJECT" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/TEST-MITRA.apk"

      # --------------------------------------------------
      # 16. UPLOAD APK
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk/TEST-MITRA.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 17. BUILD SUMMARY
      # --------------------------------------------------
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "===================================="
          echo "       TEST MITRA APK READY"
          echo "===================================="
          echo ""
          echo "APK:"
          ls -lh apk/TEST-MITRA.apk
          echo ""
          echo "Build completed successfully."

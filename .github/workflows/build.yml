name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------
      # Find the existing ZIP - NO NEW ZIP REQUIRED
      # ------------------------------------------------
      - name: Find existing TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          echo "Searching repository for existing ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Existing TEST MITRA ZIP not found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using existing ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ------------------------------------------------
      # Extract existing ZIP
      # ------------------------------------------------
      - name: Extract existing TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching Android project..."

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            DIR=$(dirname "$settings_file")

            if [ -f "$DIR/app/build.gradle.kts" ] || \
               [ -f "$DIR/app/build.gradle" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ------------------------------------------------
      # AndroidX + Gradle properties
      # ------------------------------------------------
      - name: Fix AndroidX and Gradle properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          # Remove old conflicting values
          sed -i '/^android.useAndroidX=/d' gradle.properties
          sed -i '/^android.enableJetifier=/d' gradle.properties
          sed -i '/^android.nonTransitiveRClass=/d' gradle.properties
          sed -i '/^org.gradle.configuration-cache=/d' gradle.properties

          # Required AndroidX settings
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # Stable Gradle settings
          echo "android.nonTransitiveRClass=false" >> gradle.properties
          echo "org.gradle.configuration-cache=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

          echo "gradle.properties:"
          cat gradle.properties

      # ------------------------------------------------
      # Fix AGP / Kotlin compatibility
      # ------------------------------------------------
      - name: Fix Android Gradle Plugin compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Gradle version files..."

          if [ -f "gradle/libs.versions.toml" ]; then

            echo "Found version catalog."

            # Convert AGP 9.x to stable AGP 8.9.2
            sed -i -E \
              's/agp[[:space:]]*=[[:space:]]*"9\.[0-9.]+"/agp = "8.9.2"/' \
              gradle/libs.versions.toml

            # Also handle androidGradlePlugin naming
            sed -i -E \
              's/androidGradlePlugin[[:space:]]*=[[:space:]]*"9\.[0-9.]+"/androidGradlePlugin = "8.9.2"/' \
              gradle/libs.versions.toml

            echo "Updated version catalog:"
            grep -iE "agp|androidGradlePlugin" gradle/libs.versions.toml || true

          fi

          # If build.gradle files directly contain AGP 9.x,
          # replace it with AGP 8.9.2.
          find . -name "build.gradle.kts" -o -name "build.gradle" | while read FILE
          do
            sed -i -E \
              's/com\.android\.application[^"]*version[[:space:]]*["'\'']9\.[0-9.]+["'\'']/com.android.application version "8.9.2"/g' \
              "$FILE" || true

            sed -i -E \
              's/com\.android\.library[^"]*version[[:space:]]*["'\'']9\.[0-9.]+["'\'']/com.android.library version "8.9.2"/g' \
              "$FILE" || true
          done

          echo "Compatibility patch completed."

      # ------------------------------------------------
      # Create Supabase .env only if secrets exist
      # ------------------------------------------------
      - name: Create Supabase environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then

            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > "$PROJECT_DIR/.env"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> "$PROJECT_DIR/.env"

            echo "Supabase environment created."

          else

            echo "Supabase secrets not supplied."
            echo "Continuing APK build."

          fi

      # ------------------------------------------------
      # Setup Gradle
      # ------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ------------------------------------------------
      # Clean project
      # ------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          echo "Project cleaned."

      # ------------------------------------------------
      # Verify important files
      # ------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Important files:"

          ls -la

          test -f settings.gradle.kts || \
          test -f settings.gradle

          test -f app/build.gradle.kts || \
          test -f app/build.gradle

          echo ""
          echo "Android project verified."

      # ------------------------------------------------
      # Build APK
      # ------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " BUILDING TEST MITRA APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean \
            assembleDebug

      # ------------------------------------------------
      # Find APK
      # ------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" apk-output/TEST-MITRA-debug.apk

      # ------------------------------------------------
      # Upload APK
      # ------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30

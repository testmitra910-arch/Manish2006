name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. EXTRACT TEST MITRA ZIP
      # ==========================================
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for TEST MITRA ZIP..."
          echo "======================================"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo ""
          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -400


      # ==========================================
      # 4. FIND ANDROID PROJECT
      # ==========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android project..."
          echo "======================================"

          PROJECT_DIR=""

          # First look for settings.gradle / settings.gradle.kts
          while IFS= read -r SETTINGS_FILE; do

            DIR="$(dirname "$SETTINGS_FILE")"

            if [ -f "$DIR/gradlew" ] || \
               [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              2>/dev/null
          )


          # If not found, look for app/build.gradle
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r APP_GRADLE; do

              DIR="$(dirname "$APP_GRADLE")"

              PROJECT_DIR="$(dirname "$DIR")"

              if [ -f "$PROJECT_DIR/settings.gradle" ] || \
                 [ -f "$PROJECT_DIR/settings.gradle.kts" ] || \
                 [ -f "$PROJECT_DIR/gradlew" ]; then

                break

              fi

              PROJECT_DIR=""

            done < <(
              find "$GITHUB_WORKSPACE/extracted" \
                -type f \
                \( \
                  -path "*/app/build.gradle" \
                  -o \
                  -path "*/app/build.gradle.kts" \
                \) \
                2>/dev/null
            )

          fi


          # Final fallback
          if [ -z "$PROJECT_DIR" ]; then

            echo "Android project not found."

            echo ""
            echo "Searching all Gradle files..."

            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print

            echo ""
            echo "All extracted files:"

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1

          fi


          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 5. GOOGLE SERVICES
      # ==========================================
      - name: Create google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not provided."
            echo "Skipping Google Services file."
            exit 0
          fi

          mkdir -p "$PROJECT_DIR/app"

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > "$PROJECT_DIR/app/google-services.json"

          echo "google-services.json created."


      # ==========================================
      # 6. REMOVE DUPLICATE GOOGLE SERVICES
      # ==========================================
      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          FILES=()

          while IFS= read -r FILE; do
            FILES+=("$FILE")
          done < <(
            find "$PROJECT_DIR/app" \
              -type f \
              -name "google-services.json" \
              2>/dev/null
          )

          if [ "${#FILES[@]}" -gt 1 ]; then

            echo "Duplicate google-services.json files found."

            for ((i=1; i<${#FILES[@]}; i++)); do
              echo "Removing:"
              echo "${FILES[$i]}"
              rm -f "${FILES[$i]}"
            done

          else

            echo "No duplicate Google Services files."

          fi


      # ==========================================
      # 7. CHECK MAIN ACTIVITY
      # ==========================================
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          echo "Searching MainActivity..."

          find "$PROJECT_DIR/app/src" \
            -type f \
            \( \
              -name "MainActivity.kt" \
              -o \
              -name "MainActivity.java" \
            \) \
            -print


          MAIN_COUNT=$(
            find "$PROJECT_DIR/app/src" \
              -type f \
              \( \
                -name "MainActivity.kt" \
                -o \
                -name "MainActivity.java" \
              \) \
              | wc -l
          )


          if [ "$MAIN_COUNT" -eq 0 ]; then
            echo "ERROR: MainActivity not found."
            exit 1
          fi

          echo "MainActivity found."


      # ==========================================
      # 8. PREPARE GRADLE WRAPPER
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo ""
          echo "Gradle files:"
          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "gradlew" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print


          if [ -f "./gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x ./gradlew

          else

            echo "Gradle wrapper not found."

            echo "Installing Gradle 8.7..."

            curl -L \
              "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
              -o /tmp/gradle-8.7.zip

            rm -rf /tmp/gradle-8.7

            mkdir -p /tmp/gradle-8.7

            unzip -q \
              /tmp/gradle-8.7.zip \
              -d /tmp/gradle-8.7

            /tmp/gradle-8.7/gradle-8.7/bin/gradle \
              wrapper \
              --gradle-version 8.7

            chmod +x ./gradlew

          fi


          echo ""
          echo "Gradle version:"

          ./gradlew --version


      # ==========================================
      # 9. VERIFY ANDROID PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERIFYING PROJECT"
          echo "======================================"

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi


          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then

            echo "ERROR: app Gradle file not found."

            find app \
              -maxdepth 3 \
              -type f \
              | sort

            exit 1

          fi


          echo "Android project verified successfully."


      # ==========================================
      # 10. CLEAN
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 11. BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING TEST MITRA APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ==========================================
      # 12. FIND APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print


          APK=$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1
          )


          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi


          echo ""
          echo "APK FOUND:"
          echo "$APK"


          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TEST-MITRA-debug.apk"


      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error

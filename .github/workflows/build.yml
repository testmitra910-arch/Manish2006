name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find TEST MITRA ZIP
      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "test-mitra.zip" \
            -o -iname "testmitra.zip" \
            -o -iname "*test*mitra*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 4. Extract project
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -150

      # 5. Locate Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" \
            -o -name "settings.gradle" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "gradlew" \
              | head -n 1 | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # 6. Verify project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Project files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle*" \
            -o -name "settings.gradle*" \
            -o -name "gradle-wrapper.properties" \
            -o -name "AndroidManifest.xml" \
            -o -name "MainActivity.kt" \)

      # 7. Configure Android SDK 36
      - name: Configure Android SDK compatibility
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Updating compileSdk to 36..."

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do
            sed -i -E \
              's/(compileSdk[[:space:]]*=?[[:space:]]*)[0-9]+/\136/g' "$FILE"

            sed -i -E \
              's/(compileSdkVersion[[:space:]]+)[0-9]+/\136/g' "$FILE"
          done

          echo "compileSdk values:"
          grep -R "compileSdk" . \
            --include="build.gradle" \
            --include="build.gradle.kts" || true

      # 8. Fix Google Services problem
      - name: Fix Google Services configuration
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Checking Google Services..."

          GOOGLE_FILE="app/google-services.json"

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "GOOGLE_SERVICES_JSON secret found."

            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > "$GOOGLE_FILE"

            if ! python3 -m json.tool "$GOOGLE_FILE" >/dev/null 2>&1; then
              echo "ERROR: GOOGLE_SERVICES_JSON is not valid JSON."
              rm -f "$GOOGLE_FILE"
              exit 1
            fi

            echo "google-services.json created."
          else
            echo "No GOOGLE_SERVICES_JSON secret found."
            echo "Removing Google Services plugin so APK build can continue."

            find . -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print0 | while IFS= read -r -d '' FILE
            do
              sed -i '/com\.google\.gms\.google-services/d' "$FILE"
              sed -i '/com.google.gms.google-services/d' "$FILE"
            done

            find . -type f -name "google-services.json" -delete || true
          fi

      # 9. Fix Kotlin source sets
      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do
            sed -i '/kotlin\.sourceSets/d' "$FILE"
            sed -i '/sourceSets.*kotlin/d' "$FILE"
          done

          echo "Kotlin source set compatibility checked."

      # 10. Ensure AndroidX
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          mkdir -p gradle

          if [ ! -f gradle.properties ]; then
            touch gradle.properties
          fi

          grep -q '^android.useAndroidX=' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

          echo "AndroidX configured."

      # 11. Fix deprecated Jetifier option
      - name: Fix deprecated Android options
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          if [ -f gradle.properties ]; then
            sed -i '/android\.enableJetifier/d' gradle.properties
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

      # 12. Verify MainActivity
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          MAIN_FILE=$(find app/src/main -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo "WARNING: MainActivity not found."
          else
            echo "MainActivity:"
            echo "$MAIN_FILE"
          fi

      # 13. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 14. Prepare Gradle wrapper
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            echo "No Gradle wrapper found."
            gradle --version
          fi

      # 15. Clean project
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # 16. Build APK
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Starting TEST MITRA APK build..."

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 17. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find . -type f | grep -E '\.apk$' || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 18. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.ANDROID_PROJECT }}/${{ env.APK_PATH }}
          if-no-files-found: error

      # 19. Success
      - name: Build successful
        shell: bash
        run: |
          echo "======================================"
          echo "       TEST MITRA APK BUILD SUCCESS"
          echo "======================================"
          echo "APK: $APK_PATH"

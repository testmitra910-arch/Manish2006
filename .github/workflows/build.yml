name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Find and Extract TEST MITRA ZIP
      # --------------------------------------------------
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          echo "Searching for TEST MITRA ZIP..."

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort


      # --------------------------------------------------
      # 3. Locate Android project
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort


      # --------------------------------------------------
      # 4. Fix MainActivity adminProfile error
      # --------------------------------------------------
      - name: Fix MainActivity
        shell: bash
        run: |
          set -e

          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found!"
            exit 1
          fi

          echo "Fixing MainActivity.kt..."

          python3 - <<'PY'
          from pathlib import Path

          p = Path("'''$PROJECT_DIR'''/app/src/main/java/com/example/MainActivity.kt")
          text = p.read_text()

          old = 'onOpenSettings = { if (adminProfile.isMainAdmin) showSupabaseConfigDialog = true }'

          new = 'onOpenSettings = { if (profile.isMainAdmin) showSupabaseConfigDialog = true }'

          if old in text:
              text = text.replace(old, new)
              p.write_text(text)
              print("MainActivity adminProfile error fixed.")
          else:
              print("MainActivity line already fixed or not found.")
          PY


      # --------------------------------------------------
      # 5. Fix AGP 9 + KSP source set compatibility
      # --------------------------------------------------
      - name: Fix Gradle Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          PROPS="$PROJECT_DIR/gradle.properties"

          echo "Updating gradle.properties..."

          if [ -f "$PROPS" ]; then

            if grep -q "^android.disallowKotlinSourceSets=" "$PROPS"; then
              sed -i 's/^android.disallowKotlinSourceSets=.*/android.disallowKotlinSourceSets=false/' "$PROPS"
            else
              echo "" >> "$PROPS"
              echo "# Compatibility for AGP 9 + KSP" >> "$PROPS"
              echo "android.disallowKotlinSourceSets=false" >> "$PROPS"
            fi

          else
            echo "android.disallowKotlinSourceSets=false" > "$PROPS"
          fi

          echo "Current gradle.properties:"
          cat "$PROPS"


      # --------------------------------------------------
      # 6. Setup JDK 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 7. Setup Gradle
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # --------------------------------------------------
      # 8. Create Supabase .env
      # --------------------------------------------------
      - name: Create .env from GitHub Secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing!"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing!"
            exit 1
          fi

          case "$SUPABASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: Invalid SUPABASE_URL"
              exit 1
              ;;
          esac

          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > "$PROJECT_DIR/.env"
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> "$PROJECT_DIR/.env"

          echo ".env created successfully."


      # --------------------------------------------------
      # 9. Check project
      # --------------------------------------------------
      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "TEST MITRA PROJECT"
          echo "======================================"

          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) \
            | sort

          echo "======================================"

          echo "MainActivity check:"
          grep -n "onOpenSettings" \
            app/src/main/java/com/example/MainActivity.kt || true


      # --------------------------------------------------
      # 10. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building TEST MITRA APK..."
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"


      # --------------------------------------------------
      # 11. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching APK..."

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

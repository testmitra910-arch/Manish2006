name: TEST MITRA APK BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully"

          find extracted -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Android project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -200

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platform-tools" >/dev/null

          "$SDKMANAGER" "platforms;android-36" >/dev/null

          "$SDKMANAGER" "build-tools;36.0.0" >/dev/null

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android SDK 36 installed and licenses accepted."

      - name: Configure Gradle for Android SDK 36
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradle.properties" ]; then
            {
              echo ""
              echo "android.suppressUnsupportedCompileSdk=36"
              echo "android.defaults.buildfeatures.buildconfig=true"
              echo "android.nonTransitiveRClass=false"
            } >> gradle.properties
          else
            cat > gradle.properties <<'EOF'
          android.suppressUnsupportedCompileSdk=36
          android.defaults.buildfeatures.buildconfig=true
          android.nonTransitiveRClass=false
          EOF
          fi

          echo "Gradle properties configured."

      - name: Fix Android compile SDK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do
            echo "Checking $FILE"

            sed -i \
              -E 's/(compileSdk[[:space:]]*[=:][[:space:]]*)35/\136/g' \
              "$FILE" || true

            sed -i \
              -E 's/(compileSdk[[:space:]]+)[0-9]+/\136/g' \
              "$FILE" || true
          done

          echo "Compile SDK check completed."

      - name: Remove broken Google Services plugin
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do
            echo "Checking Google Services plugin in $FILE"

            sed -i \
              '/com.google.gms.google-services/d' \
              "$FILE" || true

            sed -i \
              '/google-services/d' \
              "$FILE" || true
          done

          rm -f app/google-services.json
          rm -f app/src/main/google-services.json
          rm -f app/src/debug/google-services.json

          echo "Google Services plugin disabled."

      - name: Fix Kotlin source sets
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradle.properties" ]; then
            if ! grep -q "android.disallowKotlinSourceSets=false" gradle.properties; then
              echo "android.disallowKotlinSourceSets=false" >> gradle.properties
            fi
          else
            echo "android.disallowKotlinSourceSets=false" > gradle.properties
          fi

          echo "Kotlin source set compatibility enabled."

      - name: Find Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "No Gradle wrapper found."
            echo "GitHub Gradle will be used."
          fi

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "STARTING TEST MITRA APK BUILD"
          echo "========================================"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

          echo "========================================"
          echo "APK BUILD COMPLETED"
          echo "========================================"

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Build successful
        shell: bash
        run: |
          echo "========================================"
          echo "       TEST MITRA APK READY"
          echo "========================================"
          echo "APK uploaded successfully."

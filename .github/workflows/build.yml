name: TEST MITRA APK BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found ZIP:"
          echo "$ZIP_FILE"

      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Android project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -200

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools"

          "$SDKMANAGER" "platforms;android-36"

          "$SDKMANAGER" "build-tools;36.0.0"

          yes | "$SDKMANAGER" --licenses || true

          echo "Android SDK 36 configured successfully."

      - name: Configure Gradle properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q "android.suppressUnsupportedCompileSdk" gradle.properties; then
            echo "android.suppressUnsupportedCompileSdk=36" >> gradle.properties
          fi

          if ! grep -q "android.disallowKotlinSourceSets" gradle.properties; then
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          fi

          if ! grep -q "android.defaults.buildfeatures.buildconfig" gradle.properties; then
            echo "android.defaults.buildfeatures.buildconfig=true" >> gradle.properties
          fi

          if ! grep -q "android.nonTransitiveRClass" gradle.properties; then
            echo "android.nonTransitiveRClass=false" >> gradle.properties
          fi

          echo "Gradle properties configured."

      - name: Fix Android compile SDK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do
            echo "Checking:"
            echo "$FILE"

            sed -i -E \
              's/(compileSdk[[:space:]]*[=:][[:space:]]*)35/\136/g' \
              "$FILE" || true

            sed -i -E \
              's/(compileSdk[[:space:]]+)[0-9]+/\136/g' \
              "$FILE" || true

          done

          echo "Compile SDK check completed."

      - name: Remove broken Google Services configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do

            echo "Checking:"
            echo "$FILE"

            sed -i \
              '/com.google.gms.google-services/d' \
              "$FILE" || true

            sed -i \
              '/com.google.firebase.appdistribution/d' \
              "$FILE" || true

          done

          rm -f app/google-services.json
          rm -f app/src/main/google-services.json
          rm -f app/src/debug/google-services.json

          echo "Google Services configuration cleaned."

      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q "android.disallowKotlinSourceSets=false" gradle.properties; then
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          fi

          echo "Kotlin source set compatibility configured."

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          echo "Using installed Gradle:"
          gradle --version

          echo "Checking Gradle version..."

          GRADLE_VERSION=$(gradle --version | \
            grep '^Gradle ' | \
            awk '{print $2}')

          echo "Detected Gradle version: $GRADLE_VERSION"

          if [ "$GRADLE_VERSION" != "9.3.1" ]; then
            echo "ERROR: Gradle 9.3.1 is required."
            exit 1
          fi

          echo "Correct Gradle version confirmed."

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          gradle clean --no-daemon

          echo "Project cleaned successfully."

      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "STARTING TEST MITRA APK BUILD"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "========================================"
          echo "APK BUILD COMPLETED"
          echo "========================================"

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."

            echo "Searching all APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Build successful
        shell: bash
        run: |
          echo "========================================"
          echo "       TEST MITRA APK READY"
          echo "========================================"
          echo ""
          echo "APK build successful."
          echo "Open the Artifacts section to download the APK."

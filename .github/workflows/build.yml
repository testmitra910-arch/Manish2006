name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 2 -type f -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f -print

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted \
              -type f \
              -name "settings.gradle" \
              -print \
              -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found after extracting ZIP."
            echo ""
            echo "Searching for Gradle files:"
            find extracted -type f \
              \( -name "build.gradle.kts" -o -name "build.gradle" \) \
              -print
            exit 1
          fi

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create .env from GitHub Secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing"
            exit 1
          fi

          printf '%s\n' \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            > .env

          echo ".env created successfully"

      - name: Fix MainActivity references
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          MAIN_FILE=$(find app/src/main/java \
            -type f \
            -name "MainActivity.kt" \
            -print \
            -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            find app/src -type f -name "*.kt" -print
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_FILE"

          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          replacements = {
              "adminProfile.isMainAdmin": "profile.isMainAdmin",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          p.write_text(text, encoding="utf-8")

          print("MainActivity references checked.")
          PY

      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          if [ -f "gradle.properties" ]; then
            if ! grep -q "android.disallowKotlinSourceSets=false" gradle.properties; then
              echo "android.disallowKotlinSourceSets=false" >> gradle.properties
            fi
          else
            echo "android.disallowKotlinSourceSets=false" > gradle.properties
          fi

          echo "Kotlin source set compatibility configured."

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "================================="
          echo "ANDROID PROJECT"
          echo "================================="
          pwd

          echo ""
          echo "Project files:"
          ls -la

          test -f settings.gradle.kts || \
          test -f settings.gradle

          test -f app/build.gradle.kts || \
          test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Android project verification SUCCESS."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "================================="
          echo "BUILDING TEST MITRA APK"
          echo "================================="

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Searching for APK..."

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            find app/build -type f 2>/dev/null || true
            exit 1
          fi

          echo "================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "================================="
          echo "$APK"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: extracted/**/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30

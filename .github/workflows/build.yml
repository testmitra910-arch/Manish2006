name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Find ZIP
      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      # 4. Extract project
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      # 5. Locate Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "settings.gradle" \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # 6. Show project files
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \)

      # 7. Create google-services.json if secret exists
      - name: Create google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          APP_DIR="$PROJECT_DIR/app"

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$APP_DIR/google-services.json"
            echo "google-services.json created."
          else
            echo "GOOGLE_SERVICES_JSON secret not supplied."
            echo "Continuing without creating a new file."
          fi

      # 8. Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # 9. Check compileSdk
      - name: Fix Android SDK compatibility
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then

            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
              "$APP_GRADLE"

            sed -i -E \
              's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' \
              "$APP_GRADLE"

            echo "compileSdk compatibility checked."
          fi

      # 10. IMPORTANT:
      # Do NOT use Gradle 8.11.1.
      # AGP 9.1.1 requires Gradle 9.3.1 or newer.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      # 11. Verify Gradle
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

          echo
          echo "Expected Gradle: 9.3.1 or newer"

      # 12. Verify MainActivity
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f -name "MainActivity.kt" | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_FILE"

      # 13. Clean project
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --no-daemon --stacktrace

      # 14. Build APK
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting TEST MITRA APK build..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 15. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/TEST-MITRA.apk"

      # 16. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: TEST-MITRA.apk
          if-no-files-found: error

      # 17. Success
      - name: Build successful
        shell: bash
        run: |
          echo "======================================"
          echo " TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh TEST-MITRA.apk

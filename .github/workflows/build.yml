name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. JAVA 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. LOCATE ANDROID PROJECT
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$PWD"
          else
            PROJECT_DIR=$(find "$PWD" -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find "$PWD" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. CREATE GOOGLE SERVICES JSON
      # --------------------------------------------------
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/app/src/debug"
          mkdir -p "$PROJECT_DIR/app"

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Using GOOGLE_SERVICES_JSON secret."

            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' \
              > "$PROJECT_DIR/app/google-services.json"

          else
            echo "GOOGLE_SERVICES_JSON secret not found."
            echo "Creating safe dummy google-services.json for build."

            cat > "$PROJECT_DIR/app/google-services.json" <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "test-mitra-build",
              "storage_bucket": "test-mitra-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "status": 2
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          echo "google-services.json created."

      # --------------------------------------------------
      # 5. REMOVE GOOGLE SERVICES FILE FROM DEBUG SOURCE
      #    IF DUPLICATE FILES EXIST
      # --------------------------------------------------
      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR/app/src" -type f \
            -name "google-services.json" \
            -print

          rm -f "$PROJECT_DIR/app/src/debug/google-services.json"
          rm -f "$PROJECT_DIR/app/src/Debug/google-services.json"

      # --------------------------------------------------
      # 6. FIX KOTLIN SOURCE SET COMPATIBILITY
      # --------------------------------------------------
      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradle.properties" ]; then
            if ! grep -q "android.disallowKotlinSourceSets=false" gradle.properties; then
              echo "android.disallowKotlinSourceSets=false" >> gradle.properties
            fi
          else
            echo "android.disallowKotlinSourceSets=false" > gradle.properties
          fi

          echo "Kotlin source set compatibility configured."

      # --------------------------------------------------
      # 7. REMOVE OLD BUILD CACHE
      # --------------------------------------------------
      - name: Clean old build files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew 2>/dev/null || true

          ./gradlew clean --no-daemon || true

      # --------------------------------------------------
      # 8. VERIFY MAIN ACTIVITY
      # --------------------------------------------------
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt not found."
            find "$PROJECT_DIR/app/src/main" -type f | head -100
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN_ACTIVITY"

          echo "Checking profile references..."

          grep -n "profile" "$MAIN_ACTIVITY" || true

      # --------------------------------------------------
      # 9. BUILD DEBUG APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # --------------------------------------------------
      # 10. FIND APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # --------------------------------------------------
      # 11. UPLOAD APK
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

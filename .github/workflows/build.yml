name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR=$(dirname "$FILE")

            if [ -d "$DIR/app" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE/extracted" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 6 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Configure Android project
        shell: bash
        run: |
          set -e

          APP="$ANDROID_PROJECT/app/build.gradle.kts"

          if [ ! -f "$APP" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "Original build.gradle.kts:"
          cat "$APP"

          # Add compileSdk if missing
          if ! grep -q "compileSdk" "$APP"; then
            sed -i '/android {/a\    compileSdk = 35' "$APP"
          else
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 35/g' "$APP"
          fi

          # Add targetSdk if missing
          if ! grep -q "targetSdk" "$APP"; then
            sed -i '/defaultConfig {/a\        targetSdk = 35' "$APP"
          else
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 35/g' "$APP"
          fi

          # Add minSdk if missing
          if ! grep -q "minSdk" "$APP"; then
            sed -i '/defaultConfig {/a\        minSdk = 23' "$APP"
          else
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 23/g' "$APP"
          fi

          echo "Fixed build.gradle.kts:"
          cat "$APP"

      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROPS="$ANDROID_PROJECT/gradle.properties"

          touch "$PROPS"

          grep -q "^android.useAndroidX=" "$PROPS" || echo "android.useAndroidX=true" >> "$PROPS"
          grep -q "^android.enableJetifier=" "$PROPS" || echo "android.enableJetifier=false" >> "$PROPS"

      - name: Fix Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip

          rm -rf /tmp/gradle

          mkdir -p /tmp/gradle

          unzip -q /tmp/gradle.zip -d /tmp/gradle

          /tmp/gradle/gradle-9.3.1/bin/gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          pwd

          echo ""
          echo "APP GRADLE:"
          cat app/build.gradle.kts

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          ./gradlew clean --no-daemon --stacktrace

      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "======================================"
          echo "BUILDING TEST MITRA APK"
          echo "======================================"

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_PROJECT" \
            -type f \
            -name "*debug*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$ANDROID_PROJECT" -type f -name "*.apk"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" "$GITHUB_WORKSPACE/apk/TEST-MITRA.apk"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk/TEST-MITRA.apk
          if-no-files-found: error

      - name: Build successful
        if: success()
        run: |
          echo "======================================"
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"

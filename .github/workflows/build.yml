name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout GitHub repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup JDK 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Find and extract TEST MITRA ZIP
      # --------------------------------------------------
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          echo "Searching for TEST MITRA ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for Android project..."

          PROJECT_DIR=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. Show project structure
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

          test -f "$PROJECT_DIR/settings.gradle.kts" || \
          test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" || \
          test -f "$PROJECT_DIR/app/build.gradle"

      # --------------------------------------------------
      # 5. Create .env from GitHub Secrets
      # --------------------------------------------------
      - name: Create .env
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          case "$SUPABASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: SUPABASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" \
            > "$PROJECT_DIR/.env"

          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" \
            >> "$PROJECT_DIR/.env"

          echo ".env created successfully."

      # --------------------------------------------------
      # 6. Fix Gradle / AGP compatibility
      # --------------------------------------------------
      - name: Fix Gradle and Android plugin compatibility
        shell: bash
        run: |
          set -e

          PROJECT="$PROJECT_DIR"

          echo "Checking version catalog..."

          if [ -f "$PROJECT/gradle/libs.versions.toml" ]; then

            # AGP 9.x + built-in Kotlin was causing the
            # Kotlin source-set/KSP build failure.
            sed -i 's/agp = "9\.1\.1"/agp = "8.9.2"/' \
              "$PROJECT/gradle/libs.versions.toml"

            echo "AGP version fixed."

          fi

          # Use a stable compile/target SDK for AGP 8.9.x.
          if [ -f "$PROJECT/app/build.gradle.kts" ]; then

            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/' \
              "$PROJECT/app/build.gradle.kts" || true

            sed -i 's/targetSdk = 36/targetSdk = 35/' \
              "$PROJECT/app/build.gradle.kts" || true

          fi

          # Disable Gradle configuration cache because some
          # plugins in the generated project are not fully
          # compatible with it.
          if [ -f "$PROJECT/gradle.properties" ]; then
            if ! grep -q "^org.gradle.configuration-cache=false" "$PROJECT/gradle.properties"; then
              echo "org.gradle.configuration-cache=false" >> "$PROJECT/gradle.properties"
            fi
          fi

          echo "Compatibility fixes completed."

      # --------------------------------------------------
      # 7. Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # --------------------------------------------------
      # 8. Clean old generated files
      # --------------------------------------------------
      - name: Clean generated files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf app/build
          rm -rf build

          find . -type d -name "generated" -prune -exec rm -rf {} + 2>/dev/null || true

          echo "Old generated files removed."

      # --------------------------------------------------
      # 9. Build Debug APK
      # --------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Building TEST MITRA APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            clean \
            assembleDebug

      # --------------------------------------------------
      # 10. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TEST-MITRA-debug.apk"

      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30

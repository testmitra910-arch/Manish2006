name: Build TEST MITRA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup JDK 17
      # IMPORTANT: No Gradle cache here
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Find TEST MITRA ZIP
      # --------------------------------------------------
      - name: Find TEST MITRA ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \( \
            -iname "test-mitra.zip" -o \
            -iname "*test*mitra*.zip" \
          \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 4. Extract TEST MITRA project
      # --------------------------------------------------
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -300

      # --------------------------------------------------
      # 5. Locate Android project
      # --------------------------------------------------
      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r f; do
            DIR=$(dirname "$f")

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | sort)

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r f; do
              DIR=$(dirname "$f")

              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(find extracted -type f \
              \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) \
              | sort)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 6. Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          echo "Project: $PROJECT"

          test -f "$PROJECT/settings.gradle" || \
          test -f "$PROJECT/settings.gradle.kts"

          test -f "$PROJECT/app/build.gradle" || \
          test -f "$PROJECT/app/build.gradle.kts"

          echo "Android project verification OK."

      # --------------------------------------------------
      # 7. Create google-services.json
      # --------------------------------------------------
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' \
              > "$PROJECT/app/google-services.json"

            echo "google-services.json created from secret."
          else
            echo "GOOGLE_SERVICES_JSON secret not provided."
            echo "Continuing without creating a new file."
          fi

      # --------------------------------------------------
      # 8. Fix duplicate google-services files
      # --------------------------------------------------
      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          FILES=$(find "$PROJECT" -type f \
            -name "google-services.json" \
            -print)

          echo "google-services files:"
          echo "$FILES"

          COUNT=$(printf '%s\n' "$FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -gt 1 ]; then
            KEEP="$PROJECT/app/google-services.json"

            if [ -f "$KEEP" ]; then
              while IFS= read -r FILE; do
                [ -z "$FILE" ] && continue
                [ "$FILE" = "$KEEP" ] && continue
                rm -f "$FILE"
              done <<< "$FILES"
            fi
          fi

      # --------------------------------------------------
      # 9. Configure AndroidX
      # --------------------------------------------------
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          PROPS="$PROJECT/gradle.properties"

          touch "$PROPS"

          if ! grep -q "^android.useAndroidX=" "$PROPS"; then
            echo "android.useAndroidX=true" >> "$PROPS"
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROPS"
          fi

          if ! grep -q "^android.enableJetifier=" "$PROPS"; then
            echo "android.enableJetifier=true" >> "$PROPS"
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROPS"
          fi

          echo "AndroidX configured."

      # --------------------------------------------------
      # 10. Fix Kotlin source set compatibility
      # --------------------------------------------------
      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          for FILE in "$PROJECT/build.gradle.kts" "$PROJECT/app/build.gradle.kts"; do
            if [ -f "$FILE" ]; then

              # Replace old kotlin.sourceSets DSL usage with
              # Android sourceSets-compatible structure where possible.
              sed -i \
                's/kotlin\.sourceSets/android.sourceSets/g' \
                "$FILE" || true

              # Remove old Kotlin source set blocks that commonly
              # conflict with newer Android Gradle Plugin.
              sed -i \
                '/kotlin\.sourceSets[[:space:]]*{/d' \
                "$FILE" || true
            fi
          done

          echo "Kotlin source compatibility checked."

      # --------------------------------------------------
      # 11. Fix minSdk and targetSdk compatibility
      # --------------------------------------------------
      - name: Fix Android SDK compatibility
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          find "$PROJECT" -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE; do

            echo "Checking $FILE"

            # Only add compileSdk if android block exists.
            if grep -q "android[[:space:]]*{" "$FILE"; then

              if ! grep -Eq "compileSdk[[:space:]]*[= ]" "$FILE"; then
                sed -i \
                  '/android[[:space:]]*{/a\
    compileSdk = 35' \
                  "$FILE" || true
              fi

              # Kotlin DSL
              sed -i \
                's/minSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/minSdk = 23/g' \
                "$FILE" || true

              sed -i \
                's/targetSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/targetSdk = 35/g' \
                "$FILE" || true

              # Groovy
              sed -i \
                's/minSdk[[:space:]]\+[0-9][0-9]*/minSdk 23/g' \
                "$FILE" || true

              sed -i \
                's/targetSdk[[:space:]]\+[0-9][0-9]*/targetSdk 35/g' \
                "$FILE" || true
            fi
          done

          echo "Android SDK compatibility checked."

      # --------------------------------------------------
      # 12. Verify MainActivity
      # --------------------------------------------------
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          echo "Searching for MainActivity..."

          find "$PROJECT/app/src" -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            -print || true

          echo "MainActivity check completed."

      # --------------------------------------------------
      # 13. Setup Gradle 9.3.1
      # IMPORTANT:
      # We do NOT use setup-gradle cache detection from repository.
      # Gradle is installed explicitly.
      # --------------------------------------------------
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # --------------------------------------------------
      # 14. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          cd "$PROJECT"

          echo "Gradle version:"
          gradle --version

          echo "Project files:"
          ls -la

          # Create local Gradle properties if required.
          touch gradle.properties

          echo "Gradle prepared."

      # --------------------------------------------------
      # 15. Clean project
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          cd "$PROJECT"

          gradle clean --no-daemon --stacktrace

      # --------------------------------------------------
      # 16. Build TEST MITRA Debug APK
      # --------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          cd "$PROJECT"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # --------------------------------------------------
      # 17. Find APK
      # --------------------------------------------------
      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.android_project.outputs.project_dir }}"

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT/app/build" -type f | sort || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 18. Upload TEST MITRA APK
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error

      # --------------------------------------------------
      # 19. Build successful
      # --------------------------------------------------
      - name: Build successful
        shell: bash
        run: |
          echo "======================================"
          echo "      TEST MITRA APK BUILD SUCCESS"
          echo "======================================"
          echo "APK uploaded as:"
          echo "TEST-MITRA-debug-apk"

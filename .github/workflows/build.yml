name: TEST MITRA APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. FIND ZIP
      # ==========================================
      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 4. EXTRACT ZIP
      # ==========================================
      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."


      # ==========================================
      # 5. LOCATE ANDROID PROJECT
      # ==========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$PROJECT" ]; then
            PROJECT="$(find extracted -type f -name 'settings.gradle' -print -quit)"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. VERIFY PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===================================="
          echo "ANDROID PROJECT"
          echo "===================================="

          pwd

          echo "===================================="
          echo "GRADLE FILES"
          echo "===================================="

          find . -type f \( \
            -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradle.properties' \
            -o -name 'libs.versions.toml' \
          \) -print


      # ==========================================
      # 7. FIND AND CONFIGURE SDKMANAGER
      # ==========================================
      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -n "$ANDROID_HOME" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android /opt/android-sdk /opt -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found."
            echo "Searching Android SDK..."
            find /usr/local/lib/android /opt/android-sdk /opt -type f -name sdkmanager 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "SDKMANAGER FOUND:"
          echo "$SDKMANAGER"

          SDK_DIR="$(dirname "$(dirname "$SDKMANAGER")")"

          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36 installed successfully."


      # ==========================================
      # 8. INSTALL GRADLE 9.3.1
      # ==========================================
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          rm -rf /opt/gradle
          mkdir -p /opt/gradle

          unzip -q /tmp/gradle.zip -d /opt/gradle

          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          /opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle --version


      # ==========================================
      # 9. CONFIGURE GRADLE
      # ==========================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          grep -q '^android.useAndroidX=' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

          grep -q '^org.gradle.jvmargs=' gradle.properties \
            || echo 'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' >> gradle.properties

          grep -q '^kotlin.code.style=' gradle.properties \
            || echo 'kotlin.code.style=official' >> gradle.properties

          echo "Gradle properties configured."


      # ==========================================
      # 10. COMPILE SDK 36
      # ==========================================
      - name: Configure Android compileSdk 36
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          find . -type f \( \
            -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
          \) -print0 | while IFS= read -r -d '' FILE
          do

            sed -i -E \
              's/(compileSdk[[:space:]]*=?[[:space:]]*)35/\136/g' \
              "$FILE" || true

            sed -i -E \
              's/(compileSdkVersion[[:space:]]+)[0-9]+/\136/g' \
              "$FILE" || true

          done

          echo "compileSdk 36 configured."


      # ==========================================
      # 11. PREPARE GRADLE
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===================================="
          echo "GRADLE VERSION"
          echo "===================================="

          gradle --version

          echo "===================================="
          echo "GRADLE WRAPPER NOT REQUIRED"
          echo "===================================="


      # ==========================================
      # 12. CLEAN PROJECT
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 13. BUILD APK
      # ==========================================
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===================================="
          echo "STARTING TEST MITRA APK BUILD"
          echo "===================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo "===================================="
          echo "APK BUILD FINISHED"
          echo "===================================="


      # ==========================================
      # 14. FIND APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK="$(find . -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Searching for APK files:"
            find . -type f -name '*.apk' -print || true

            exit 1
          fi

          echo "===================================="
          echo "APK FOUND"
          echo "===================================="

          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TEST-MITRA-debug.apk"


      # ==========================================
      # 15. UPLOAD APK
      # ==========================================
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error


      # ==========================================
      # 16. SUCCESS
      # ==========================================
      - name: Build successful
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       TEST MITRA APK BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK: TEST-MITRA-debug.apk"
          echo ""

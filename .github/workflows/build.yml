name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Find and extract TEST MITRA ZIP
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -300

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -300

      # 4. Locate Android project automatically
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            DIR="$(dirname "$settings_file")"

            if [ -f "$DIR/gradlew" ] || \
               [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            2>/dev/null)

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r gradle_file; do
              DIR="$(dirname "$gradle_file")"

              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              2>/dev/null)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found after ZIP extraction."
            echo "All extracted files:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Create google-services.json from GitHub Secret
      - name: Create google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set."
            echo "Continuing without Google Services file."
            exit 0
          fi

          mkdir -p "$PROJECT_DIR/app"

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > "$PROJECT_DIR/app/google-services.json"

          echo "google-services.json created."

      # 6. Remove duplicate google-services.json files
      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          FIRST_FILE=""

          while IFS= read -r file; do
            if [ -z "$FIRST_FILE" ]; then
              FIRST_FILE="$file"
            else
              echo "Removing duplicate: $file"
              rm -f "$file"
            fi
          done < <(
            find "$PROJECT_DIR/app" \
              -type f \
              -name "google-services.json" \
              2>/dev/null
          )

          echo "Google services cleanup complete."

      # 7. Fix Kotlin source-set compatibility
      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          echo "Checking Kotlin files..."

          find "$PROJECT_DIR/app/src/main" \
            -type f \
            \( -name "*.kt" -o -name "*.java" \) \
            -print 2>/dev/null || true

      # 8. Prepare Gradle
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating wrapper..."

            GRADLE_VERSION="8.7"

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version "$GRADLE_VERSION"
            else
              curl -L \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                -o /tmp/gradle.zip

              mkdir -p /tmp/gradle

              unzip -q /tmp/gradle.zip -d /tmp/gradle

              /tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
                --gradle-version "$GRADLE_VERSION"
            fi
          fi

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # 9. Verify project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -300

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "Android project verified."

      # 10. Verify MainActivity
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          echo "Searching MainActivity..."

          find "$PROJECT_DIR/app/src" \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            -print

          MAIN_COUNT=$(find "$PROJECT_DIR/app/src" \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            | wc -l)

          if [ "$MAIN_COUNT" -eq 0 ]; then
            echo "ERROR: MainActivity not found."
            exit 1
          fi

          echo "MainActivity found."

      # 11. Clean project
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean --no-daemon

      # 12. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 13. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TEST-MITRA-debug.apk"

      # 14. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error

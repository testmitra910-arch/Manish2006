name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env from GitHub Secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          test -n "$SUPABASE_URL" || {
            echo "ERROR: GitHub Secret SUPABASE_URL is missing"
            exit 1
          }

          test -n "$SUPABASE_ANON_KEY" || {
            echo "ERROR: GitHub Secret SUPABASE_ANON_KEY is missing"
            exit 1
          }

          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "ERROR: SUPABASE_URL must start with https://"
              exit 1
              ;;
          esac

          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Fix MainActivity settings reference
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/example/MainActivity.kt"

          test -f "$FILE" || {
            echo "ERROR: $FILE not found"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/MainActivity.kt")
          text = p.read_text(encoding="utf-8")

          old1 = 'onOpenSettings = { if (adminProfile.isMainAdmin) showSupabaseConfigDialog = true },'
          old2 = 'onOpenSettings = { if (profile.isMainAdmin) showSupabaseConfigDialog = true },'
          new  = 'onOpenSettings = { if (profile.isMainAdmin) showSupabaseConfigDialog = true },'

          if old1 in text:
              text = text.replace(old1, new, 1)
              p.write_text(text, encoding="utf-8")
              print("Fixed: adminProfile -> profile")
          elif old2 in text:
              print("Already correct: profile.isMainAdmin")
          else:
              print("No matching settings reference found; continuing.")
          PY

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/MainActivity.kt

          echo "Android project files OK"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' | head -n 1)"

          test -n "$APK" || {
            echo "ERROR: APK not found"
            exit 1
          }

          echo "APK created: $APK"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

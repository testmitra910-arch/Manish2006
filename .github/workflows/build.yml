name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. LOCATE ANDROID PROJECT
      # ==================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android project..."
          echo "======================================"

          PROJECT_DIR=""

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$PWD"
          else
            PROJECT_DIR=$(find "$PWD" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo ""
            echo "Repository files:"
            find "$PWD" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 4. CHECK ANDROID PROJECT
      # ==================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -300

          echo ""

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          echo "Android project verification successful."


      # ==================================================
      # 5. CREATE GOOGLE SERVICES JSON
      # ==================================================
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then

            echo "Using GOOGLE_SERVICES_JSON secret."

            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' \
              > app/google-services.json

          elif [ -f "app/google-services.json" ]; then

            echo "google-services.json already exists."

          else

            echo "GOOGLE_SERVICES_JSON secret not found."
            echo "Creating temporary build configuration."

            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "test-mitra-build",
              "storage_bucket": "test-mitra-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.testmitra"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "status": 2
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          fi

          echo "Google services configuration ready."


      # ==================================================
      # 6. REMOVE DUPLICATE GOOGLE SERVICES FILES
      # ==================================================
      - name: Fix duplicate google-services files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Searching duplicate google-services.json files..."

          find app/src -type f \
            -name "google-services.json" \
            -print || true

          rm -f app/src/debug/google-services.json
          rm -f app/src/Debug/google-services.json

          echo "Duplicate files cleaned."


      # ==================================================
      # 7. FIX KOTLIN SOURCE SET COMPATIBILITY
      # ==================================================
      - name: Fix Kotlin source set compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q "^android.disallowKotlinSourceSets=false" gradle.properties; then
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          fi

          echo "Kotlin source set compatibility configured."


      # ==================================================
      # 8. MAKE GRADLE EXECUTABLE
      # ==================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --version


      # ==================================================
      # 9. VERIFY MAIN ACTIVITY
      # ==================================================
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Searching MainActivity.kt..."

          MAIN_ACTIVITY=$(find app/src/main \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt not found."

            find app/src/main \
              -type f \
              | sort \
              | head -200

            exit 1
          fi

          echo ""
          echo "MainActivity found:"
          echo "$MAIN_ACTIVITY"

          echo ""
          echo "Checking profile references..."

          grep -n "profile" "$MAIN_ACTIVITY" || true


      # ==================================================
      # 10. CLEAN
      # ==================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 11. BUILD DEBUG APK
      # ==================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING TEST MITRA APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

          echo ""
          echo "APK build completed."


      # ==================================================
      # 12. FIND APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Searching APK files..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==================================================
      # 13. UPLOAD APK
      # ==================================================
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

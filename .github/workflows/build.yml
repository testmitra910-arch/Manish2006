name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT SOURCE
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. JAVA 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # --------------------------------------------------
      # 3. GRADLE 9.3.1
      # --------------------------------------------------
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'


      # --------------------------------------------------
      # 4. FIND TEST MITRA ZIP
      # --------------------------------------------------
      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for TEST MITRA ZIP..."

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 5. EXTRACT PROJECT
      # --------------------------------------------------
      - name: Extract TEST MITRA project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully."

          echo "Top level:"
          find extracted -maxdepth 2 -type f | head -100


      # --------------------------------------------------
      # 6. LOCATE ANDROID PROJECT
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 7. SHOW PROJECT FILES
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f | sort | head -200


      # --------------------------------------------------
      # 8. GOOGLE SERVICES
      # --------------------------------------------------
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          APP_DIR="$PROJECT_DIR/app"

          mkdir -p "$APP_DIR"

          if [ -f "$APP_DIR/google-services.json" ]; then
            echo "google-services.json already exists."
          else
            echo "google-services.json not found."

            cat > "$APP_DIR/google-services.json" <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "test-mitra",
              "storage_bucket": "test-mitra.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.testmitra"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "DUMMY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

            echo "Dummy google-services.json created."
          fi


      # --------------------------------------------------
      # 9. ANDROIDX / KOTLIN COMPATIBILITY
      # --------------------------------------------------
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          if ! grep -q "^android.disallowKotlinSourceSets=" gradle.properties; then
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          fi

          if ! grep -q "^kotlin.code.style=" gradle.properties; then
            echo "kotlin.code.style=official" >> gradle.properties
          fi

          echo ""
          echo "======================================"
          echo "GRADLE PROPERTIES"
          echo "======================================"

          cat gradle.properties


      # --------------------------------------------------
      # 10. FIX COMPILE SDK / TARGET SDK
      # --------------------------------------------------
      - name: Fix Android SDK compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APP_GRADLE="app/build.gradle.kts"
          APP_GRADLE_GROOVY="app/build.gradle"

          if [ -f "$APP_GRADLE" ]; then

            echo "Kotlin Gradle file found."

            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 35/g' \
              "$APP_GRADLE" || true

            sed -i -E \
              's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 35/g' \
              "$APP_GRADLE" || true

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 23/g' \
              "$APP_GRADLE" || true

          elif [ -f "$APP_GRADLE_GROOVY" ]; then

            echo "Groovy Gradle file found."

            sed -i -E \
              's/compileSdk[[:space:]]+[0-9]+/compileSdk 35/g' \
              "$APP_GRADLE_GROOVY" || true

            sed -i -E \
              's/targetSdk[[:space:]]+[0-9]+/targetSdk 35/g' \
              "$APP_GRADLE_GROOVY" || true

            sed -i -E \
              's/minSdk[[:space:]]+[0-9]+/minSdk 23/g' \
              "$APP_GRADLE_GROOVY" || true

          fi


      # --------------------------------------------------
      # 11. VERIFY MAIN ACTIVITY
      # --------------------------------------------------
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          echo "Searching MainActivity..."

          find "$PROJECT_DIR/app/src" \
            -type f \
            \( \
              -name "MainActivity.kt" \
              -o -name "MainActivity.java" \
            \) \
            -print || true


      # --------------------------------------------------
      # 12. PREPARE GRADLE 9.3.1
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PREPARING GRADLE 9.3.1"
          echo "======================================"

          if [ -f "gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x gradlew

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

              sed -i \
                's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
                gradle/wrapper/gradle-wrapper.properties

            fi

          else

            echo "Gradle wrapper not found."
            echo "Creating Gradle 9.3.1 wrapper..."

            gradle wrapper --gradle-version 9.3.1

            chmod +x gradlew

          fi

          echo ""
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          ./gradlew --version


      # --------------------------------------------------
      # 13. CHECK WRAPPER VERSION
      # --------------------------------------------------
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle wrapper properties:"

          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Checking Gradle..."

          ./gradlew --version


      # --------------------------------------------------
      # 14. CLEAN PROJECT
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "======================================"
          echo "CLEAN PROJECT"
          echo "======================================"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 15. BUILD DEBUG APK
      # --------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "======================================"
          echo "BUILDING TEST MITRA APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # --------------------------------------------------
      # 16. FIND APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING APK"
          echo "======================================"

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print


      # --------------------------------------------------
      # 17. UPLOAD APK
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # --------------------------------------------------
      # 18. BUILD SUCCESS
      # --------------------------------------------------
      - name: Build successful
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       TEST MITRA APK BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "APK has been uploaded to GitHub Actions Artifacts."
          echo ""

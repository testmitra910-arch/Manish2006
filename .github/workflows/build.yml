name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Fix Android build configuration
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          # Keep the previously working AGP fix.
          if [ -f "$P/gradle/libs.versions.toml" ]; then
            sed -i \
              's/agp = "9\.1\.1"/agp = "8.9.2"/' \
              "$P/gradle/libs.versions.toml"
          fi

          # Keep the previous SDK configuration.
          if [ -f "$P/app/build.gradle.kts" ]; then

            sed -i \
              's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/' \
              "$P/app/build.gradle.kts"

            sed -i \
              's/targetSdk = 36/targetSdk = 35/' \
              "$P/app/build.gradle.kts"

          fi

          touch "$P/gradle.properties"

          grep -q '^android.useAndroidX=true' \
            "$P/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$P/gradle.properties"

          grep -q '^android.enableJetifier=true' \
            "$P/gradle.properties" || \
            echo 'android.enableJetifier=true' >> "$P/gradle.properties"

          sed -i \
            's/^org.gradle.configuration-cache=true$/org.gradle.configuration-cache=false/' \
            "$P/gradle.properties"

          grep -q '^org.gradle.configuration-cache=' \
            "$P/gradle.properties" || \
            echo 'org.gradle.configuration-cache=false' >> "$P/gradle.properties"

          echo "Build configuration fixed."

      - name: Configure Supabase for build
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then

            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
              "$SUPABASE_URL" \
              "$SUPABASE_ANON_KEY" > "$P/.env"

            echo "Supabase secrets configured."

          else

            if [ -f "$P/.env.example" ]; then
              cp "$P/.env.example" "$P/.env"
              echo "Supabase secrets not supplied; using .env.example."
            else
              echo "WARNING: .env.example not found."
              touch "$P/.env"
            fi

          fi

      # IMPORTANT:
      # The previous workflow used Gradle 8.11.1.
      # This project now uses Gradle 9.3.1.
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

          echo "Gradle setup completed."

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          echo "Project cleaned."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."

            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" \
            apk-output/TEST-MITRA-debug.apk

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build successful
        shell: bash
        run: |
          echo "======================================"
          echo " TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: apk-output/TEST-MITRA-debug.apk"
